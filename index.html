<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Image Downloader — Per-Page Folders</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root{
    --bg:#0b1020; --bg2:#111933; --card:#151e3d; --line:#243056;
    --text:#e7ecff; --mute:#8b97c2; --accent:#7c9bff; --accent2:#a06bff;
    --ok:#5be3a7; --err:#ff7a90; --warn:#ffd166;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:
    radial-gradient(1200px 600px at 10% -10%,#1b2a64 0%,transparent 60%),
    radial-gradient(1000px 600px at 110% 10%,#3a1d6b 0%,transparent 55%),
    var(--bg);
    color:var(--text);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:980px;margin:0 auto;padding:40px 20px 80px}
  header{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .logo{width:42px;height:42px;border-radius:12px;
    background:conic-gradient(from 210deg,var(--accent),var(--accent2),var(--accent));
    box-shadow:0 10px 30px -10px rgba(124,155,255,.7)}
  h1{margin:0;font-size:24px;letter-spacing:-.01em}
  .sub{color:var(--mute);margin:4px 0 28px}
  .card{background:linear-gradient(180deg,var(--card),var(--bg2));
    border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin-bottom:18px;
    box-shadow:0 20px 50px -30px rgba(0,0,0,.6)}
  .card h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
  textarea,input,select{width:100%;background:#0c1430;color:var(--text);
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;outline:none}
  textarea{min-height:130px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px}
  textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,155,255,.18)}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:12px}
  label.opt{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px;
    background:#0c1430;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
  label.opt input{width:auto}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;font:600 14px/1 inherit;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;
    box-shadow:0 10px 25px -10px rgba(160,107,255,.7);transition:transform .08s ease}
  button:hover{transform:translateY(-1px)}
  button:disabled{opacity:.55;cursor:not-allowed;transform:none}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
  .bar{height:10px;background:#0c1430;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
  .bar > div{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
  .stats{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-top:8px}
  pre.log{background:#070b1c;border:1px solid var(--line);border-radius:10px;
    padding:12px;max-height:320px;overflow:auto;margin:0;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
  .log .ok{color:var(--ok)} .log .err{color:var(--err)} .log .warn{color:var(--warn)} .log .dim{color:var(--mute)}
  .log b{color:#cdd6ff}
  a.dl{display:inline-block;margin-top:10px;color:white;text-decoration:none;
    background:linear-gradient(135deg,#3ddc97,#2bb673);padding:12px 18px;border-radius:10px;font-weight:700;
    box-shadow:0 10px 25px -10px rgba(61,220,151,.6)}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#1a2452;color:var(--mute);font-size:12px;margin-left:6px}
  .note{color:var(--mute);font-size:12.5px;margin-top:8px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2a3568;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"></div>
    <div>
      <h1>Image Downloader <span class="pill">per-page folders</span></h1>
      <div class="sub">Ilagay ang URLs (isa kada linya). Ido-download lahat ng images at i-zip ng nakafolder bawat page.</div>
    </div>
  </header>

  <div class="card">
    <h2>URLs</h2>
    <textarea id="urls" placeholder="https://example.com/page-1&#10;https://example.com/page-2"></textarea>
    <div class="row">
      <label class="opt"><input type="checkbox" id="bg" checked> Isama CSS backgrounds</label>
      <label class="opt"><input type="checkbox" id="srcset" checked> Pinakamalaking srcset</label>
      <label class="opt"><input type="checkbox" id="dedupe" checked> I-skip dobleng image</label>
      <label class="opt">Min size (KB)
        <input type="number" id="minkb" value="0" min="0" style="width:80px;margin-left:6px">
      </label>
    </div>
    <div class="actions">
      <button id="go">⬇ Download &amp; Zip</button>
      <button class="ghost" id="clear">Clear</button>
    </div>
    <div class="note">Tip: Kung naka-block ng site ang fetch, awtomatikong susubukan ng tool ang iba't ibang public CORS proxies.</div>
  </div>

  <div class="card">
    <h2>Progress</h2>
    <div class="bar"><div id="pb"></div></div>
    <div class="stats"><span id="status">Standby</span><span id="count">0 / 0</span></div>
    <div id="dlwrap"></div>
  </div>

  <div class="card">
    <h2>Log</h2>
    <pre class="log" id="log">Ready.</pre>
  </div>
</div>

<script>
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,
  u => `https://thingproxy.freeboard.io/fetch/${u}`,
];

const $ = id => document.getElementById(id);
const logEl = $('log');
function log(msg, cls){
  const span = document.createElement('span');
  if(cls) span.className = cls;
  span.textContent = msg + '\n';
  logEl.appendChild(span);
  logEl.scrollTop = logEl.scrollHeight;
}
function setStatus(s){ $('status').textContent = s; }
function setProgress(done,total){
  $('count').textContent = `${done} / ${total}`;
  $('pb').style.width = total? (done/total*100)+'%' : '0%';
}

async function fetchWithFallback(url, asBlob=false){
  // Try direct first (rarely works for HTML cross-origin)
  const attempts = [url, ...PROXIES.map(p=>p(url))];
  let lastErr;
  for(let i=0;i<attempts.length;i++){
    try{
      const res = await fetch(attempts[i], {redirect:'follow'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      return asBlob ? await res.blob() : await res.text();
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('All proxies failed');
}

function safeName(s){
  return s.replace(/[^a-z0-9._-]+/gi,'_').replace(/^_+|_+$/g,'').slice(0,120) || 'file';
}
function folderName(u){
  try{
    const x = new URL(u);
    let p = (x.hostname + x.pathname).replace(/\/+$/,'').replace(/[^a-z0-9._\-/]+/gi,'_');
    return p.replace(/\//g,'_').slice(0,140) || x.hostname;
  }catch{ return safeName(u); }
}
function extFromContentType(ct){
  if(!ct) return '';
  ct = ct.split(';')[0].trim().toLowerCase();
  const m = {'image/jpeg':'jpg','image/jpg':'jpg','image/png':'png','image/gif':'gif',
    'image/webp':'webp','image/svg+xml':'svg','image/avif':'avif','image/bmp':'bmp','image/x-icon':'ico'};
  return m[ct] || '';
}
function extFromUrl(u){
  try{
    const p = new URL(u).pathname;
    const m = p.match(/\.([a-z0-9]{2,5})(?:$|\?)/i);
    return m ? m[1].toLowerCase() : '';
  }catch{ return ''; }
}

function extractImages(html, baseUrl, opts){
  const doc = new DOMParser().parseFromString(html,'text/html');
  const base = doc.querySelector('base')?.getAttribute('href');
  const baseHref = base ? new URL(base, baseUrl).href : baseUrl;
  const urls = new Set();
  const abs = s => { try { return new URL(s, baseHref).href; } catch { return null; } };

  doc.querySelectorAll('img').forEach(img=>{
    const cand = [img.getAttribute('src'), img.getAttribute('data-src'),
      img.getAttribute('data-lazy-src'), img.getAttribute('data-original')];
    const ss = img.getAttribute('srcset') || img.getAttribute('data-srcset');
    if(ss){
      const parts = ss.split(',').map(s=>s.trim()).filter(Boolean)
        .map(s=>{const [u,w]=s.split(/\s+/);return {u, w: parseInt(w)||0};});
      if(opts.srcset && parts.length){
        parts.sort((a,b)=>b.w-a.w);
        cand.unshift(parts[0].u);
      } else {
        parts.forEach(p=>cand.push(p.u));
      }
    }
    cand.filter(Boolean).forEach(s=>{const a=abs(s); if(a) urls.add(a);});
  });

  doc.querySelectorAll('source[srcset]').forEach(s=>{
    s.getAttribute('srcset').split(',').forEach(p=>{
      const u = p.trim().split(/\s+/)[0]; const a = abs(u); if(a) urls.add(a);
    });
  });

  doc.querySelectorAll('a[href]').forEach(a=>{
    const h = a.getAttribute('href');
    if(/\.(jpe?g|png|gif|webp|svg|avif|bmp)(\?|$)/i.test(h)){
      const u = abs(h); if(u) urls.add(u);
    }
  });

  if(opts.bg){
    const re = /url\(\s*(['"]?)([^'")]+)\1\s*\)/gi;
    doc.querySelectorAll('[style]').forEach(el=>{
      const st = el.getAttribute('style')||''; let m;
      while((m=re.exec(st))){ const a=abs(m[2]); if(a) urls.add(a); }
    });
    doc.querySelectorAll('style').forEach(s=>{
      const t = s.textContent||''; let m;
      while((m=re.exec(t))){ const a=abs(m[2]); if(a) urls.add(a); }
    });
  }
  return [...urls].filter(u=>/^https?:/i.test(u));
}

async function fetchImage(u){
  const attempts = [u, ...PROXIES.map(p=>p(u))];
  let lastErr;
  for(const a of attempts){
    try{
      const res = await fetch(a);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const blob = await res.blob();
      if(blob.size === 0) throw new Error('empty');
      return blob;
    }catch(e){ lastErr=e; }
  }
  throw lastErr;
}

$('clear').onclick = ()=>{
  logEl.textContent = 'Ready.\n';
  $('urls').value=''; setProgress(0,0); setStatus('Standby'); $('dlwrap').innerHTML='';
};

$('go').onclick = async ()=>{
  const urls = $('urls').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!urls.length){ log('Walang URL.','warn'); return; }
  const opts = { bg:$('bg').checked, srcset:$('srcset').checked, dedupe:$('dedupe').checked,
    minkb: parseInt($('minkb').value)||0 };

  $('go').disabled = true; $('dlwrap').innerHTML='';
  logEl.textContent=''; setStatus('Working...');

  const zip = new JSZip();
  let totalImgs = 0, done = 0, ok = 0, fail = 0;
  const seenHash = new Set();

  // Pass 1: collect
  const pageJobs = [];
  for(const pageUrl of urls){
    log(`→ Fetching page: ${pageUrl}`, 'dim');
    try{
      const html = await fetchWithFallback(pageUrl);
      const imgs = extractImages(html, pageUrl, opts);
      log(`   nahanap: ${imgs.length} image(s)`, imgs.length? 'ok':'warn');
      totalImgs += imgs.length;
      pageJobs.push({pageUrl, imgs});
    }catch(e){
      log(`   failed: ${e.message}`, 'err');
      pageJobs.push({pageUrl, imgs:[], error:e.message});
    }
  }

  if(!totalImgs){
    log('Walang images na nakuha.','err');
    setStatus('Done with errors');
    $('go').disabled=false; return;
  }

  // Pass 2: download
  for(const job of pageJobs){
    if(!job.imgs.length) continue;
    const folder = zip.folder(folderName(job.pageUrl));
    let idx = 0;
    for(const u of job.imgs){
      idx++;
      try{
        const blob = await fetchImage(u);
        if(blob.size < opts.minkb*1024){
          log(`   skip (small): ${u}`,'dim'); fail++; done++; setProgress(done,totalImgs); continue;
        }
        if(opts.dedupe){
          const key = blob.size+'_'+(blob.type||'');
          // size+type isn't perfect but cheap
          if(seenHash.has(u)) { done++; setProgress(done,totalImgs); continue; }
          seenHash.add(u);
        }
        let ext = extFromContentType(blob.type) || extFromUrl(u) || 'bin';
        let base = safeName(decodeURIComponent(u.split('/').pop().split('?')[0] || 'img'+idx));
        if(!base.toLowerCase().endsWith('.'+ext)) base = base.replace(/\.[a-z0-9]+$/i,'') + '.' + ext;
        // ensure unique
        let name = base, n=1;
        while(folder.file(name)) name = base.replace(/(\.[^.]+)?$/, '_'+(n++)+'$1');
        folder.file(name, blob);
        ok++;
        log(`   ✓ ${name} (${(blob.size/1024).toFixed(1)} KB)`,'ok');
      }catch(e){
        fail++;
        log(`   ✗ ${u} — ${e.message}`,'err');
      }
      done++; setProgress(done,totalImgs);
    }
  }

  setStatus('Zipping...');
  const out = await zip.generateAsync({type:'blob'},(meta)=>{
    setStatus(`Zipping ${meta.percent.toFixed(0)}%`);
  });
  const url = URL.createObjectURL(out);
  const a = document.createElement('a');
  a.className='dl'; a.href=url; a.download='images.zip';
  a.textContent=`⬇ Download images.zip (${(out.size/1024/1024).toFixed(2)} MB)`;
  $('dlwrap').appendChild(a);
  setStatus(`Tapos! ${ok} ok, ${fail} failed`);
  log(`\nDone. ${ok} saved, ${fail} failed.`,'ok');
  $('go').disabled=false;
};
</script>
</body>
</html>
